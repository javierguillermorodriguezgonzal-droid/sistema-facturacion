<!DOCTYPE html>
<html>
<head>
    <title>Consultar inventario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor">
    <h1>Consultar inventario</h1>
    <p>Consulte y descargue la informacion del inventario</p>
    <form>
        <label>INGRESE LA FECHA QUE DESEA CONSULTAR:</label>
        <br>
        <input type="date">
        <br><br>
        <label>SELECCIONE CATEGORIA</label>
        <select>
            <option value="1">TODOS LOS PRODUCTOS</option>
            <option value="2">PESCADOS</option>
            <option value="3">CARNES</option>
            <option value="4">PASTAS</option>
            <option value="5">AVES</option>
            <option value="6">ARROZ</option>
            <option value="7">BEBIDAS</option>
            <option value="8">BEBIDAS PREPARADAS</option>
        </select>
        <br><br>
        <button type="button">DESCARGAR INVENTARIO</button>
        <br><br>
    </form>
    <br>
    <a href="index.html">
        <button class="boton_menu-volver">Volver al menu</button>
    </a>
    </div>
</body>
</html>
