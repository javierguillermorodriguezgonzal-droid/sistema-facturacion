<!DOCTYPE html>
<html>
<head>
    <title>Editar producto</title>
    <link rel="stylesheet" href="{{url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="contenedor">
    <h1>Editar producto</h1>
    <p>Edite la informacion de un producto existente</p>
    <form method="POST" action="{{ url_for('editar_producto') }}">
        <label>Codigo del producto:</label>
        <br>
        <input type="text" name="Product_code" value="{{ producto[2] if producto else '' }}">
        <button type="submit" name="accion" value="buscar">
            BUSCAR PRODUCTO
        </button>
        <br><br>
        <label>Cantidad actual:</label>
        <br>
        <input type="number" name="Stock" value="{{ producto [7] if producto else '' }}" readonly>
        <br><br>
        <label>Nombre del producto:</label>
        <br>
        <input type="text" name="name" value="{{ producto[3] if producto else '' }}">
        <br><br>
        <label>Categoria:</label>
         <br>
        <select name="Id_Categoria">
            <option value="1"{% if producto and producto[1] == 1 %}selected{% endif %}>PESCADOS</option>
            <option value="2"{% if producto and producto[1] == 2 %}selected{% endif %}>CARNES</option>
            <option value="3"{% if producto and producto[1] == 3 %}selected{% endif %}>PASTAS</option>
            <option value="4"{% if producto and producto[1] == 4 %}selected{% endif %}>AVES</option>
            <option value="5"{% if producto and producto[1] == 5 %}selected{% endif %}>ARROZ</option>
            <option value="6"{% if producto and producto[1] == 6 %}selected{% endif %}>BEBIDAS</option>
            <option value="7"{% if producto and producto[1] == 7 %}selected{% endif %}>BEBIDAS PREPARADAS</option>
        </select>
        <br><br>
        <label>Precio compra:</label>
        <br>
        <input type="number" name="Purchase_price" value="{{ producto[5] if producto else '' }}">
        <br><br>
        <label>Precio venta:</label>
        <br>
        <input type="number" name="Selling_price" value="{{ producto [6] if producto else '' }}">
        <br><br>
        <button type="submit" name="accion" value="guardar">
            CONFIRMAR CAMBIOS
        </button>
    </form>
    <br>
    <a href="{{ url_for('productos') }}">
        <button class="boton_menu-volver">Volver a productos</button>
    </a>
    </div>
</body>
</html>
