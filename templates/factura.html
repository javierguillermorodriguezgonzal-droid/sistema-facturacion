<!DOCTYPE html>
<html>
<head>
    <title>Factura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="contenedor">
    <h1>FACTURA DE VENTA</h1>

    <h2>Informacion de cliente</h2>
    <form method="GET">
        <label>Numero de documento o RUT:</label>
        <input type="text" name="identification">
        <button type="submit">BUSCAR CLIENTE</button>
        <label>Nombre del cliente:</label>
        <input type="text" name="name" readonly value="{{ cliente.Name if cliente else ''}}">
        <label>Numero de documento:</label>
        <input type="text" name="identification" readonly value="{{ cliente.Identification if cliente else ''}}">
        <label>Numero de celular:</label>
        <input type="text" name="phones_number" readonly value="{{ cliente.phones_number if cliente else ''}}">
        <label>Correo electronico:</label>
        <input type="email" name="Email" readonly value="{{ cliente.Email if cliente else ''}}">
        <p><strong>Fecha:</strong> {{ fecha }}</p>
        <p><strong>Hora:</strong> {{ hora }}</p>
        <p><strong>Mesa:</strong> {{ mesa }}</p>
        <h2>Detalle de la venta</h2>
        <br>
    </form>
        <label>PRODUCTOS</label>
         {% for articulo in pedido %}
         <p>
            {{ articulo["nombre"]}}
            -
            Cantidad: {{articulo["cantidad"] }}
            -
            Precio: ${{ articulo["precio"]}}
         </p>
         {% endfor %}
        <br> 
        <label>SUB-TOTAL:</label>
        <br>
        <input
           type="number"
           readonly
           value="{{ subtotal }}"
        >
        <br>
        <label>Propina voluntaria:</label>
        <br>
        <input 
            type="number"
            id="propina"
            min="0"
            placeholder="Ingrese la Propina"
        >
        <br>
        <label>TOTAL:</label>
        <br>
        <input 
            type="number"
            id="total"
            readonly
            >
        <br>
        <h2>Metodo de pago</h2>
        <br>
        <select id="metodoPago" name="metodo_pago">
            <option value="1">EFECTIVO</option>
            <option value="2">TARJETA DEBITO</option>
            <option value="3">TARJETA CREDITO</option>
            <option value="4">TRANSFERENCIA</option>
            <option value="5">OTROS MEDIOS DE PAGO</option>
        </select>
        <br><br>
        <button type="button" id="botonFacturar" class="boton_menu_continuar">
            FACTURAR
        </button>
        <br><br>
        <a href="{{ url_for( 'mesas' ) }}">
            <button class="boton_menu-volver">VOLVER A MESAS</button>
        </a>
        </div>

<script>

    const subtotal = Number("{{ subtotal }}");
    const campoPropina = document.getElementById("propina");
    const campoTotal = document.getElementById("total");
    const botonFacturar = document.getElementById("botonFacturar");
    const metodoPago = document.getElementById ("metodoPago")
    campoPropina.addEventListener("input", function () {
        const propina = Number(campoPropina.value) || 0;
        const total = subtotal + propina;
        campoTotal.value = total;
    });

    botonFacturar.addEventListener("click", function (){
        if (campoPropina.value === "") {
            alert("DEBE INGRESAR UN VALOR DE PROPINA. Asi no deje el cliente registre un valor");
            return;
        }
        alert(metodoPago.value);
    });
</script>
</body>
</html>
