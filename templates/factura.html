<!DOCTYPE html>
<html>
<head>
    <title>Factura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="contenedor">
    <h1>FACTURA DE VENTA</h1>
    <p><strong>Fecha:</strong> {{ fecha }}</p>
    <p><strong>Hora:</strong> {{ hora }}</p>
    <p><strong>Mesa:</strong> {{ mesa }}</p>
    <h2>Informacion de cliente</h2>
    <label>Nombre del cliente:</label>
        <br>
        <input type="text" readonly name="name">
        <br>
        <label>Numero de documento:</label>
        <br>
        <input type="text" readonly name="identification">
        <br>
        <label>Correo electronico</label>
        <br>
        <input type="text" readonly name="email">
        <br>
        <h2>Detalle de la venta</h2>
        <label>Fecha:</label>
        <input type="date" name="Fecha">
        <label>Hora:</label>
        <input type="time" id="Hora" name="Hora">
        <label>MESA:</label>
        <br>
        <input type="text" readonly>
        <br>
        <label>PRODUCTOS</label>
         {% for articulo in pedido %}
         <p>
            {{ articulo["nombre"]}}
            -
            Cantidad: {{articulo["cantidad"] }}
            -
            Precio: ${{ articulo["precio"]}}
         </p>
         {% endfor %}
        <br> 
        <label>SUB-TOTAL:</label>
        <br>
        <input
           type="number"
           readonly
           value="{{ subtotal }}"
        >
        <br>
        <label>Propina voluntaria:</label>
        <br>
        <input type="number"
            id="propina"
            min="0"
            placeholder="Ingrese la Propina"
        >
        <br>
        <label>TOTAL:</label>
        <br>
        <input 
            type="number"
            id="total"
            readonly
            >
        <br>
        <h2>Metodo de pago</h2>
        <br>
        <select>
            <option value="1">EFECTIVO</option>
            <option value="2">TARJETA DEBITO</option>
            <option value="3">TARJETA CREDITO</option>
            <option value="4">TRANSFERENCIA</option>
            <option value="5">OTROS MEDIOS DE PAGO</option>
        </select>
        <br><br>
        <a href="venta_realizada.html">
        <button class="boton_menu_continuar">FACTURAR</button>
        </a>
        <br><br>
        <a href="mesas.html">
            <button class="boton_menu-volver">VOLVER A MESAS</button>
        </a>
        </div>
</body>
<script>
    const subtotal = Number("{{ subtotal }}");
    const campoPropina = document.getElementById("propina");
    const campoTotal = document.getElementById("total:");
    campoPropina.addEventListener("input", function (){
        const propina = Number(campoPropina.value) || 0;
        const total = subtotal + propina;
        campoTotal.value = total;
    });
</script>
</html>
