<!DOCTYPE html>

<html>
<head>

    <title>Productos</title>
</head>

<body>
    <h1>Productos disponibles</h1>

    {% for producto in productos %}

       <div>

            <p>Producto: {{ producto.name }}</p>
            <p>Precio: {{ producto.Selling_price }}</p>
            <p>Stock: {{ producto.Stock }}</p>

        </div>
    {% endfor %}

</body>

</html>
